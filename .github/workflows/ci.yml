name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_VERSION: "0.12.1"

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: mypy --strict
        run: uv run mypy --strict src scripts eval

  test-and-eval:
    name: Unit tests and eval harness
    runs-on: ubuntu-latest
    # A cache miss re-embeds the whole corpus on 2 vCPUs (~2h); a hit restores
    # it in seconds. Capped well under the 6h default so a stuck run fails
    # visibly instead of quietly burning the account's minutes.
    timeout-minutes: 180
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: compliance
          POSTGRES_PASSWORD: compliance
          POSTGRES_DB: compliance_copilot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U compliance -d compliance_copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://compliance:compliance@localhost:5433/compliance_copilot
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # docker/init-db/ handles this locally, mounted into the container's
      # entrypoint directory by docker-compose. A GitHub Actions service
      # container cannot use that: services start before actions/checkout, so
      # there is no repository on disk to mount from. The pgvector image ships
      # the extension's files but CREATE EXTENSION is still per-database, so
      # without this the first VECTOR column fails with 'type "vector" does
      # not exist'.
      - name: Enable pgvector extension
        run: |
          PGPASSWORD=compliance psql -h localhost -p 5433 -U compliance \
            -d compliance_copilot -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      # BGE-M3 (~2.2GB) and Docling's layout/OCR models are downloaded on first
      # use; cache them so repeat runs don't re-download every time. Still
      # needed on a corpus-cache hit: the tests and the eval harness embed
      # their queries with the same model.
      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-models-bge-m3-docling

      # The corpus is a fixed snapshot — the same PDFs committed in
      # data/raw_pdfs/ every run, not fetched live (see data/sources.md) — so
      # its embeddings are a pure function of the PDFs, the ingestion code, the
      # schema and the model. Cache the result rather than recomputing it:
      # embedding 685 chunks with BGE-M3 on a 2-vCPU runner costs ~8.8s each,
      # about two hours, which the first real CI run spent before being
      # cancelled. Caching the model weights alone does not help — that saves
      # the download, not the inference.
      #
      # Anything in the key changing means the stored vectors no longer
      # describe this corpus, so it must miss and recompute.
      - name: Cache embedded corpus
        id: corpus-cache
        uses: actions/cache@v4
        with:
          path: /tmp/corpus-dump.sql.gz
          key: >-
            corpus-v1-${{ env.EMBEDDING_MODEL_NAME }}-${{ hashFiles(
              'data/raw_pdfs/**',
              'data/corpus_manifest.yaml',
              'src/compliance_copilot/ingest/**',
              'src/compliance_copilot/retrieval/embedder.py',
              'src/compliance_copilot/retrieval/loader.py',
              'src/compliance_copilot/db/models.py'
            ) }}

      - name: Ingest and embed corpus
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: |
          uv run python scripts/ingest_corpus.py
          uv run python scripts/load_corpus.py
          PGPASSWORD=compliance pg_dump -h localhost -p 5433 -U compliance \
            -d compliance_copilot | gzip > /tmp/corpus-dump.sql.gz

      - name: Restore embedded corpus from cache
        if: steps.corpus-cache.outputs.cache-hit == 'true'
        run: |
          gunzip -c /tmp/corpus-dump.sql.gz | PGPASSWORD=compliance psql \
            -h localhost -p 5433 -U compliance -d compliance_copilot \
            --quiet --set ON_ERROR_STOP=on
          uv run python - <<'PY'
          import asyncio, os
          from sqlalchemy import func, select
          from sqlalchemy.ext.asyncio import create_async_engine
          import sys; sys.path.insert(0, "src")
          from compliance_copilot.db.models import ChunkRow

          async def main() -> None:
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.connect() as conn:
                  embedded = await conn.scalar(
                      select(func.count()).select_from(ChunkRow).where(
                          ChunkRow.dense_embedding.is_not(None)
                      )
                  )
              await engine.dispose()
              # A dump that restored without error but landed no vectors would
              # otherwise surface as a wall of confusing retrieval failures.
              if not embedded:
                  raise SystemExit("restored corpus has no embedded chunks")
              print(f"restored {embedded} embedded chunks from cache")

          asyncio.run(main())
          PY

      # Excludes tests marked @pytest.mark.llm — those make real DeepSeek API
      # calls, cost money, and need a secret this workflow doesn't set up.
      - name: Unit tests
        run: uv run pytest -m "not llm"

      # The actual quality gate: fails the job (and the PR check) if any
      # metric regresses beyond tolerance against the committed baseline.
      - name: Eval harness
        run: uv run python eval/run_eval.py --tolerance 0.05
