id: case_013
input_spec: |
  Product: refurbished laptop computers, batch of 200 units
  Condition: previously used, tested and cleaned, original manufacturer 2023
  Input: 100-240V AC adapter, 65W
  Intended use: resale to corporate customers
language: en
expected_regulations: ["ТР ТС 004/2011", "ТР ТС 020/2011"]
expected_clauses:
  - doc: tr_eaes_037_2016
    clause: "пункт 6"
must_not_return: ["ТР ЕАЭС 037/2016", "ТР ТС 008/2011"]
notes: >
  Clause 6з excludes goods that have been in use ("бывшие в употреблении").
  Refurbished equipment is a real and frequent sourcing scenario. Tests whether
  the agent notices the condition of the goods, not just their type.