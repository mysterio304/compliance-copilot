name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_VERSION: "0.12.1"

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: mypy --strict
        run: uv run mypy --strict src scripts eval

  test-and-eval:
    name: Unit tests and eval harness
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: compliance
          POSTGRES_PASSWORD: compliance
          POSTGRES_DB: compliance_copilot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U compliance -d compliance_copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://compliance:compliance@localhost:5433/compliance_copilot
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # docker/init-db/ handles this locally, mounted into the container's
      # entrypoint directory by docker-compose. A GitHub Actions service
      # container cannot use that: services start before actions/checkout, so
      # there is no repository on disk to mount from. The pgvector image ships
      # the extension's files but CREATE EXTENSION is still per-database, so
      # without this the first VECTOR column fails with 'type "vector" does
      # not exist'.
      - name: Enable pgvector extension
        run: |
          PGPASSWORD=compliance psql -h localhost -p 5433 -U compliance \
            -d compliance_copilot -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      # BGE-M3 (~2.2GB) and Docling's layout/OCR models are downloaded on first
      # use; cache them so repeat runs don't re-download every time.
      - name: Cache HuggingFace model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-models-bge-m3-docling

      # The corpus is a fixed snapshot: the same PDFs committed in
      # data/raw_pdfs/ every run, not fetched live — see data/sources.md.
      - name: Ingest corpus
        run: uv run python scripts/ingest_corpus.py

      - name: Load corpus (embed with BGE-M3, write to Postgres)
        run: uv run python scripts/load_corpus.py

      # Excludes tests marked @pytest.mark.llm — those make real DeepSeek API
      # calls, cost money, and need a secret this workflow doesn't set up.
      - name: Unit tests
        run: uv run pytest -m "not llm"

      # The actual quality gate: fails the job (and the PR check) if any
      # metric regresses beyond tolerance against the committed baseline.
      - name: Eval harness
        run: uv run python eval/run_eval.py --tolerance 0.05
