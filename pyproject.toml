[project]
name = "compliance-copilot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "mysterio304", email = "mysterio304@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "docling>=2.117.0",
    "fastapi>=0.141.1",
    "flagembedding>=1.4.0",
    "langfuse>=4.14.2",
    "langgraph>=1.2.10",
    "openai>=2.52.0",
    "pgvector>=0.5.0",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
compliance-copilot = "compliance_copilot:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "numpy>=2.5.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "eval", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "N", "ASYNC"]
# B008: FastAPI's Depends()/Query()/etc in argument defaults is the framework's
# idiomatic dependency-injection pattern, not the mutable-default-argument bug
# this rule is designed to catch.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["compliance_copilot"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docling.*", "langgraph.*", "langfuse.*", "FlagEmbedding.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
markers = [
    "llm: makes a real DeepSeek API call — needs DEEPSEEK_API_KEY, costs money, excluded from the default CI run (`pytest -m 'not llm'`)",
]
