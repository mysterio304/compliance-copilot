id: case_012
input_spec: |
  Product: Remote-controlled toy robot
  Power: 4x AA batteries, 6V DC
  Radio: 2.4GHz remote control
  Materials: ABS plastic, PCB, small motors
  Intended use: children's toy, ages 6+
language: en
expected_regulations: ["ТР ТС 008/2011", "ТР ТС 020/2011"]
expected_clauses:
  - doc: tr_eaes_037_2016
    clause: "пункт 6"
must_not_return: ["ТР ЕАЭС 037/2016", "ТР ТС 004/2011"]
notes: >
  The highest-value case in this batch. ТР ЕАЭС 037/2016 clause 6в explicitly
  excludes "игрушки электрические" from its own scope. So an electric toy is
  covered by toy safety and EMC, but NOT by the RoHS-analogue — despite being
  obviously electronic. Tests whether the agent reads exclusion lists or only
  inclusion lists. Note the expected clause is the exclusion itself: correct
  behaviour cites clause 6 to justify NOT applying 037/2016.