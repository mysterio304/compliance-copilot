services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: compliance
      POSTGRES_PASSWORD: compliance
      POSTGRES_DB: compliance_copilot
    ports:
      # Host-side 5433 avoids colliding with a locally-installed Postgres on 5432.
      # Container-internal traffic (the api service, via `db:5432`) is unaffected.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliance -d compliance_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://compliance:compliance@db:5432/compliance_copilot
    env_file:
      - path: .env
        required: false
    volumes:
      # The image only COPYs src/, so the offline-side trees aren't in it. Mount
      # them read-only to run eval and the ingestion scripts inside the container
      # without a rebuild. Read-only because nothing here should be written from
      # the container — eval/results/ is the exception, hence its own rw mount.
      - ./eval:/app/eval:ro
      - ./scripts:/app/scripts:ro
      - ./data:/app/data:ro
      - ./eval/results:/app/eval/results
      # Without this the container re-downloads BGE-M3's ~4.3 GB of weights on
      # its first embedding call after every recreate. The host cache already
      # has them.
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
